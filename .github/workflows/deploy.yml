name: CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure Docker Insecure Registry
        run: |
          echo "Writing daemon.json..."
          echo "{\"insecure-registries\": [\"${{ secrets.NEXUS_REGISTRY }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # Sačekaj da docker daemon bude potpuno spreman pre nastavka
          timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
          echo "Docker daemon je spreman."

      - name: Login, Build and Push to Nexus Docker Registry
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_REGISTRY }} -u "${{ secrets.NEXUS_USER }}" --password-stdin

          docker build -t ${{ secrets.NEXUS_REGISTRY }}/fastapi-realworld-example-app:latest -t ${{ secrets.NEXUS_REGISTRY }}/fastapi-realworld-example-app:${{ github.sha }} .

          docker push ${{ secrets.NEXUS_REGISTRY }}/fastapi-realworld-example-app:latest
          docker push ${{ secrets.NEXUS_REGISTRY }}/fastapi-realworld-example-app:${{ github.sha }}

      - name: Send Slack Notification on Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "🚀 Uspešno izgrađena FastAPI aplikacija i poslata u Nexus!\nCommit: ${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CICD_WEBHOOK_URL }}

      - name: Send Slack Notification on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "❌ Došlo je do greške tokom CI/CD pipeline-a za FastAPI aplikaciju!"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CICD_WEBHOOK_URL }}